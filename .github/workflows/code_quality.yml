name: Code Check

on:
  push:
    branches:
      - main
  pull_request:

env:
  PYTHON_VERSION: 3.12

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      # Checkout the current code base for the job
      - uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # Upgrade pip
      - name: Set up pip
        run: |
          echo "Upgrade pip..."
          python -m pip install --upgrade pip

      # Install pipeline dependencies
      - name: Install deps from pyproject.toml
        run: |
          python - << 'EOF'
          import tomllib
          from pathlib import Path
          import subprocess, sys

          data = tomllib.loads(Path("pyproject.toml").read_text())
          deps = data["project"].get("dependencies", [])
          dev = data["project"].get("optional-dependencies", {}).get("dev", [])

          all_deps = deps + dev  # quality-check braucht Tools + Runtime

          if all_deps:
              print("Installing:", all_deps)
              subprocess.check_call([sys.executable, "-m", "pip", "install", *all_deps])
          else:
              print("No dependencies defined in pyproject.toml.")
          EOF


      # Create output folder
      - name: Prepare output folder
        run: mkdir -p reports/quality

      # Run Ruff
      - name: Run Ruff
        id: ruff
        run: |
          echo ""
          echo "========================================"
          echo "Check code style with Ruff..."
          echo "========================================"
          TIMESTAMP=$(date +%Y-%m-%d_%H%M%S)
          ruff check . --output-format concise > reports/quality/report_ruff_${TIMESTAMP}.txt
        continue-on-error: true

      # Run pylint
      - name: Run Pylint
        id: pylint
        run: |
          echo ""
          echo "========================================"
          echo "Check code style with Pylint..."
          echo "========================================"
          TIMESTAMP=$(date +%Y-%m-%d_%H%M%S)
          pylint . --rcfile=pyproject.toml --fail-on R,W,C,E,F > reports/quality/report_pylint_${TIMESTAMP}.txt
        continue-on-error: true

      # Run mypy
      - name: Run mypy
        id: mypy
        run: |
          echo ""
          echo "========================================"
          echo "Check types with mypy..."
          echo "========================================"
          TIMESTAMP=$(date +%Y-%m-%d_%H%M%S)
          mypy . --html-report reports/quality/
        continue-on-error: true

      # Evaluate individual quality checks
      - name: Quality Summary
        run: |
          echo ""
          echo "Code quality results:"
          echo "================================"
          echo "Ruff:   ${{ steps.ruff.outcome }}"
          echo "Pylint: ${{ steps.pylint.outcome }}"
          echo "mypy:   ${{ steps.mypy.outcome }}"
          echo "================================"

          # Check results
          ALL_SUCCESS=true

          if [ "${{ steps.ruff.outcome }}" != "success" ]; then
            echo "::error::❌ Ruff check failed."
            ALL_SUCCESS=false
          fi

          if [ "${{ steps.pylint.outcome }}" != "success" ]; then
            echo "::error::❌ Pylint check failed."
            ALL_SUCCESS=false
          fi

          if [ "${{ steps.mypy.outcome }}" != "success" ]; then
            echo "::error::❌ mypy check failed."
            ALL_SUCCESS=false
          fi

          if [ "$ALL_SUCCESS" != "true" ]; then
            echo "::error::❌ Code quality checks failed!"
            exit 1
          fi

          echo "::notice::✅ Code quality checks successful!"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/quality
